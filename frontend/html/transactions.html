<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions</title>
    <link rel="stylesheet" href="../style/transactions.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <div class="sidebar">
      <h2>IoT Dashboard</h2>
      <ul>
        <li>
          <a href="dashboard.html">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
          </a>
        </li>

        <li class="active">
          <a href="transactions.html">
            <i class="fas fa-receipt"></i>
            <span>Transactions</span>
          </a>
        </li>

        <li>
          <a href="storage.html">
            <i class="fas fa-coins"></i>
            <span>Coin Inventory</span>
          </a>
        </li>

        <li>
          <a href="settings.html">
            <i class="fas fa-gear"></i>
            <span>Settings</span>
          </a>
        </li>

        <li id="logout-btn">
          <a href="#">
            <i class="fas fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </div>

    <main class="main">
      <!-- Topbar -->
      <div class="topbar">
        <h1>Transaction Records</h1>

        <!-- <section>
          <label for="machine-select">Select Machine:</label>
          <select id="machine-select"></select>
        </section> -->

        <div class="status">System Online</div>
      </div>

      <div class="header-top">
        <div>
          <p>Complete history of all coin changing transactions</p>
        </div>
        <div class="header-actions"></div>
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>TRANSACTION ID</th>
              <th>¢25 COINS</th>
              <th>PESO VALUE</th>
              <th>COINS DISPENSED</th>
              <th>TIMESTAMP</th>
            </tr>
          </thead>

          <tbody id="transactionTable">
            <!-- Dynamic rows go here -->
          </tbody>
        </table>
      </div>
      <div id="pagination"></div>
    </main>

    <!-- ✅ SCRIPT AT BOTTOM -->
    <script type="module" src="../js/pages/transactions.js"></script>
    <script type="module" src="../js/pages/logout.js"></script>
