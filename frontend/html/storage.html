<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coin Inventory</title>
    <link rel="stylesheet" href="../style/storage.css" />
  </head>

  <body>
    <div class="sidebar">
      <h2>IoT Dashboard</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="transactions.html">Transactions</a></li>
        <li class="active"><a href="storage.html">Coin Inventory</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li id="logout-btn"><a href="#">Logout</a></li>
      </ul>
    </div>

    <div class="main">
      <div class="topbar">
        <div>
          <h1>Coin Inventory</h1>
        </div>

        <div class="topbar-actions">
          <div class="status">
            <span class="dot"></span>
            System Online
          </div>
        </div>
      </div>

      <div class="refill-section">
        <div class="refill-header">
          <h3>Coin Refill Management</h3>
          <p>Update coin inventory manually when the machine is refilled.</p>
        </div>

        <div class="refill-cards"></div>
      </div>

      <!-- MODAL -->
      <div class="modal" id="refillModal">
        <div class="modal-content">
          <h2 id="modalTitle">Refill Coins</h2>

          <input
            type="number"
            id="refillInput"
            placeholder="Enter number of coins"
          />

          <div class="modal-actions">
            <button class="cancel-btn" id="closeModal">Cancel</button>
            <button class="save-btn" id="saveRefill">Save</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../js/pages/storage.js"></script>
    <script type="module" src="../js/pages/logout.js"></script>
  </body>
</html>
