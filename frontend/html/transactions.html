<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions</title>
    <link rel="stylesheet" href="../style/transactions.css" />
  </head>

  <body>
    <div class="sidebar">
      <h2>IoT Dashboard</h2>
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li class="active"><a href="#">Transactions</a></li>
        <li><a href="storage.html">Coin Inventory</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li id="logout-btn"><a href="#">Logout</a></li>
      </ul>
    </div>

    <main class="main">
      <!-- Topbar -->
      <div class="topbar">
        <h1>Transaction Records</h1>
        <div class="status">System Online</div>
      </div>

      <div class="header-top">
        <div>
          <p>Complete history of all coin changing transactions</p>
        </div>
        <div class="header-actions"></div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>TRANSACTION ID</th>
              <th>¢25 COINS</th>
              <th>PESO VALUE</th>
              <th>COINS DISPENSED</th>
              <th>TIMESTAMP</th>
              <th>STATUS</th>
              <th>ACTIONS</th>
            </tr>
          </thead>

          <tbody id="transactionTable">
            <!-- Dynamic rows go here -->
          </tbody>
        </table>
      </div>
      <div id="pagination"></div>
    </main>

    <!-- ✅ SCRIPT AT BOTTOM -->
    <script type="module" src="../js/pages/transactions.js"></script>
    <script type="module" src="../js/pages/logout.js"></script>
